[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyiron_workflow_assyst"
dynamic = ["version"]
description = "A workflow package for ASSYST (Automated Symmetry and Stability Testing) using VASP calculations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "pyiron Team", email = "pyiron@mpie.de" }
]
keywords = ["pyiron", "vasp", "workflow", "dft", "materials-science", "assyst", "structure-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyiron_workflow>=0.19,<0.21",
    "flowrep>=0.6,<0.7",
    "pyiron_workflow_vasp>=0.2.0,<0.3",
    "pymatgen>=2023.0.0",
    "ase>=3.22.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "packaging",
    # tests/test_collect.py and tests/test_concat_and_save.py parse the
    # committed VASP fixtures with vaspparser directly.
    "vaspparser",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]
notebook = [
    "jupyter>=1.0.0",
    "notebook>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/ligerzero-ai/pyiron_workflow_assyst"
Documentation = "https://github.com/ligerzero-ai/pyiron_workflow_assyst"
Repository = "https://github.com/ligerzero-ai/pyiron_workflow_assyst.git"
"Bug Tracker" = "https://github.com/ligerzero-ai/pyiron_workflow_assyst/issues"

[tool.hatch.version]
path = "pyiron_workflow_assyst/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyiron_workflow_assyst"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end graph tests"] 